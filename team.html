<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Our Team</title>

    <link rel="stylesheet" href="style/base.css" />
    <link rel="stylesheet" href="style/team.css" />

    <link
      rel="stylesheet"
      href="https://unpkg.com/swiper@7/swiper-bundle.min.css"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    />
  </head>
  <body>
    <header id="nav-placeholder"></header>
    <main>
      <section class="team" id="team">
  <h1 class="heading">our team</h1>

  <section class="team-grid">
    
    <article class="team-card">
      <figure class="image">
        <img src="image/team-1.jpg" alt="Dr. John Lacy" />
      </figure>
      <div class="content">
        <h3>John Lacy</h3>
        <span>General Surgeon</span>
        <p>
          Specialized in advanced surgical procedures with over 10 years
          of experience.
        </p>
      </div>
    </article>

    <article class="team-card">
      <figure class="image">
        <img src="image/team-2.jpg" alt="Dr. Sarah John" />
      </figure>
      <div class="content">
        <h3>Sarah John</h3>
        <span>Cardiologist</span>
        <p>
          Expert in heart health and preventive cardiology.
        </p>
      </div>
    </article>

    <article class="team-card">
      <figure class="image">
        <img src="image/team-4.jpg" alt="Dr. Emma Watson" />
      </figure>
      <div class="content">
        <h3>Emma Watson</h3>
        <span>Pediatrician</span>
        <p>
          Dedicated to children’s health with compassionate care.
        </p>
      </div>
    </article>

  </section>
</section>

    </main>
    <footer id="footer-placeholder"></footer>

    <script src="script/include.js"></script>
    <script src="https://unpkg.com/swiper@7/swiper-bundle.min.js"></script>

  </body>
</html>
